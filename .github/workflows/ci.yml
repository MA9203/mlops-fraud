name: CI Pipeline

on:
  push:
    branches: [ main, dev-clean ]
  pull_request:
    branches: [ main, dev-clean ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r src/model/requirements.txt
        if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi

    - name: Run tests with pytest
      run: |
        pytest tests/ -v

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install flake8
      run: |
        pip install flake8

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, code-quality]  # Only run if tests and code quality checks pass
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build API Docker image
      run: |
        docker build -f docker/api.Dockerfile -t fraud-api .

    - name: Build Training Docker image
      run: |
        docker build -f docker/train.Dockerfile -t fraud-train .

    - name: Build UI Docker image
      run: |
        docker build -f docker/ui.Dockerfile -t fraud-ui .

    - name: Test running containers
      run: |
        docker run -d --name test-api -p 8000:8000 fraud-api
        sleep 10
        docker ps | grep test-api
        docker stop test-api